apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-logs-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  loki-logs-overview.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 24, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"expr": "{namespace=~\"$namespace\",workload_kind=~\"$workload_kind\",workload=~\"$workload\",pod=~\"$pod\",container=~\"$container\"}", "refId": "A"}],
          "title": "Kubernetes logs",
          "type": "logs"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"axisCenteredZero": false, "axisColorMode": "text", "axisLabel": "", "axisPlacement": "auto", "barAlignment": 0, "drawStyle": "line", "fillOpacity": 10, "lineInterpolation": "linear", "lineWidth": 1, "pointSize": 5, "showPoints": "auto", "spanNulls": false, "stacking": {"group": "A", "mode": "normal"}}, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 24},
          "id": 2,
          "options": {"legend": {"calcs": [], "displayMode": "table", "placement": "right", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
          "targets": [{"expr": "sum by (namespace) (count_over_time({namespace=~\"$namespace\",workload_kind=~\"$workload_kind\",workload=~\"$workload\",pod=~\"$pod\",container=~\"$container\"}[5m]))", "legendFormat": "{{namespace}}", "refId": "A"}],
          "title": "Log volume by namespace",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["example", "kubernetes", "loki", "logs"],
      "templating": {
        "list": [
          {
            "current": {"selected": true, "text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "loki"},
            "definition": "label_values(namespace)",
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": "label_values(namespace)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {"selected": true, "text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "loki"},
            "definition": "label_values({namespace=~\"$namespace\"}, workload_kind)",
            "includeAll": true,
            "label": "Workload type",
            "multi": true,
            "name": "workload_kind",
            "options": [],
            "query": "label_values({namespace=~\"$namespace\"}, workload_kind)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {"selected": true, "text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "loki"},
            "definition": "label_values({namespace=~\"$namespace\",workload_kind=~\"$workload_kind\"}, workload)",
            "includeAll": true,
            "label": "Workload",
            "multi": true,
            "name": "workload",
            "options": [],
            "query": "label_values({namespace=~\"$namespace\",workload_kind=~\"$workload_kind\"}, workload)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {"selected": true, "text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "loki"},
            "definition": "label_values({namespace=~\"$namespace\",workload_kind=~\"$workload_kind\",workload=~\"$workload\"}, pod)",
            "includeAll": true,
            "label": "Pod",
            "multi": true,
            "name": "pod",
            "options": [],
            "query": "label_values({namespace=~\"$namespace\",workload_kind=~\"$workload_kind\",workload=~\"$workload\"}, pod)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          },
          {
            "current": {"selected": true, "text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "loki"},
            "definition": "label_values({namespace=~\"$namespace\",workload_kind=~\"$workload_kind\",workload=~\"$workload\",pod=~\"$pod\"}, container)",
            "includeAll": true,
            "label": "Container",
            "multi": true,
            "name": "container",
            "options": [],
            "query": "label_values({namespace=~\"$namespace\",workload_kind=~\"$workload_kind\",workload=~\"$workload\",pod=~\"$pod\"}, container)",
            "refresh": 1,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": {"from": "now-1h", "to": "now"},
      "title": "Loki: Kubernetes Logs",
      "uid": "loki-kubernetes-logs"
    }
