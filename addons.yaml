      limits: { cpu: "200m", memory: "256Mi" }
      requests: { cpu: "100m", memory: "128Mi" }
    extraEnv:
      - name: AWS_CA_BUNDLE
        value: "/host-ca/tls-ca-bundle.pem"
    extraVolumes:
      - name: custom-ca-bundle
        hostPath: { path: "/etc/pki/tls/certs", type: Directory }
    extraVolumeMounts:
      - name: custom-ca-bundle
        mountPath: "/host-ca"
        readOnly: true

- ChartName: nats
  Enabled: true
  RepoUrl: https://nats-io.github.io/k8s/helm/charts
  ChartVersion: 2.12.4
  Namespace: nats
  ValuesFile: nats.yaml
  RolloutTargets:
    - Type: statefulset
      Name: nats
  DefaultValues:
    nats:
      resources:
        limits: { cpu: "500m", memory: "512Mi" }
        requests: { cpu: "250m", memory: "256Mi" }
    container:
      env:
        AWS_CA_BUNDLE: "/host-ca/tls-ca-bundle.pem"
      volumeMounts:
        - name: custom-ca-bundle
          mountPath: "/host-ca"
          readOnly: true
    volumes:
      - name: custom-ca-bundle
        hostPath: { path: "/etc/pki/tls/certs", type: Directory }

- ChartName: argo-cd
  Enabled: true
  RepoUrl: https://argoproj.github.io/argo-helm
  ChartVersion: 10.4.1
  Namespace: argocd
  ValuesFile: argo-cd.yaml
  PodIdentity:
    RoleArn: arn:aws:iam::123456789012:role/ArgoCDPodIdentityRole
    ServiceAccount: argocd-application-controller
  RolloutTargets:
    - Type: deployment
      Name: argocd-server
    - Type: deployment
      Name: argocd-repo-server
  DefaultValues:
    global:
      logging: { level: info }
    server:
      resources:
        limits: { cpu: "500m", memory: "512Mi" }
        requests: { cpu: "125m", memory: "256Mi" }
      env:
        - name: AWS_CA_BUNDLE
          value: "/host-ca/tls-ca-bundle.pem"
      volumes:
        - name: custom-ca-bundle
          hostPath: { path: "/etc/pki/tls/certs", type: Directory }
      volumeMounts:
        - name: custom-ca-bundle
          mountPath: "/host-ca"
          readOnly: true
    repoServer:
      resources:
        limits: { cpu: "1000m", memory: "1Gi" }
      env:
        - name: AWS_CA_BUNDLE
          value: "/host-ca/tls-ca-bundle.pem"
      volumes:
        - name: custom-ca-bundle
          hostPath: { path: "/etc/pki/tls/certs", type: Directory }
      volumeMounts:
        - name: custom-ca-bundle
          mountPath: "/host-ca"
          readOnly: true

