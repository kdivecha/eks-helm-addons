extraEnv:
- name: AWS_CA_BUNDLE
  value: /custom-ca/tls-ca-bundle.pem
extraVolumes:
- name: custom-ca
  hostPath:
    path: /etc/pki/ca-trusts/extracted/pem
    type: Directory
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
config:
  clients:
  - url: http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push
    external_labels:
      cluster: REPLACE_WITH_EKS_CLUSTER_NAME
      log_environment: REPLACE_WITH_LOG_ENVIRONMENT
  snippets:
    extraRelabelConfigs:
    - source_labels:
      - __tmp_controller_name
      action: replace
      target_label: workload
    - source_labels:
      - __meta_kubernetes_pod_controller_kind
      action: replace
      target_label: workload_kind
    - action: replace
      replacement: Deployment
      source_labels:
      - __meta_kubernetes_pod_controller_kind
      regex: ReplicaSet
      target_label: workload_kind
extraVolumeMounts:
- name: custom-ca
  readOnly: true
  mountPath: /custom-ca
