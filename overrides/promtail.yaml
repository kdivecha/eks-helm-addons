extraVolumeMounts:
- name: custom-ca-bundle
  mountPath: /host-ca
  readOnly: true
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
extraVolumes:
- name: custom-ca-bundle
  hostPath:
    type: Directory
    path: /etc/pki/tls/certs
extraEnv:
- name: AWS_CA_BUNDLE
  value: /host-ca/tls-ca-bundle.pem
config:
  snippets:
    extraRelabelConfigs:
    - action: replace
      source_labels:
      - __tmp_controller_name
      target_label: workload
    - action: replace
      source_labels:
      - __meta_kubernetes_pod_controller_kind
      target_label: workload_kind
    - action: replace
      source_labels:
      - __meta_kubernetes_pod_controller_kind
      regex: ReplicaSet
      replacement: Deployment
      target_label: workload_kind
