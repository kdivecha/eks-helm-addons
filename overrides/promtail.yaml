extraEnv:
- name: AWS_CA_BUNDLE
  value: /custom-ca/tls-ca-bundle.pem
extraVolumeMounts:
- name: custom-ca
  mountPath: /custom-ca
  readOnly: true
extraVolumes:
- name: custom-ca
  hostPath:
    type: Directory
    path: /etc/pki/ca-trusts/extracted/pem
config:
  clients:
  - url: http://loki-gateway.logging.svc.cluster.local/loki/api/v1/push
    external_labels:
      cluster: REPLACE_WITH_EKS_CLUSTER_NAME
      log_environment: REPLACE_WITH_LOG_ENVIRONMENT
  snippets:
    extraRelabelConfigs:
    - target_label: workload
      action: replace
      source_labels:
      - __tmp_controller_name
    - target_label: workload_kind
      action: replace
      source_labels:
      - __meta_kubernetes_pod_controller_kind
    - regex: ReplicaSet
      target_label: workload_kind
      action: replace
      source_labels:
      - __meta_kubernetes_pod_controller_kind
      replacement: Deployment
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

