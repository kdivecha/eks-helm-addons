serviceAccount:
  name: loki
read:
  replicas: 0
backend:
  replicas: 0
singleBinary:
  extraEnv:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem
  extraVolumes:
  - name: custom-ca
    hostPath:
      path: /etc/pki/ca-trusts/extracted/pem
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  replicas: 1
  extraVolumeMounts:
  - name: custom-ca
    mountPath: /custom-ca
deploymentMode: SingleBinary
loki:
  schemaConfig:
    configs:
    - schema: v13
      index:
        prefix: loki_index_
        period: 24h
      from: 2024-04-01
      object_store: s3
      store: tsdb
  storage:
    bucketNames:
      ruler: REPLACE_WITH_LOKI_S3_BUCKET
      chunks: REPLACE_WITH_LOKI_S3_BUCKET
write:
  replicas: 0
