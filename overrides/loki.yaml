singleBinary:
  extraEnv:
  - name: AWS_CA_BUNDLE
    value: /host-ca/tls-ca-bundle.pem
  extraVolumeMounts:
  - name: custom-ca-bundle
    mountPath: /host-ca
  extraVolumes:
  - name: custom-ca-bundle
    hostPath:
      path: /etc/pki/tls/certs
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
  replicas: 1
backend:
  replicas: 0
serviceAccount:
  name: loki
loki:
  schemaConfig:
    configs:
    - schema: v13
      index:
        prefix: loki_index_
        period: 24h
      object_store: s3
      from: 2024-04-01
      store: tsdb
  storage:
    bucketNames:
      ruler: REPLACE_WITH_LOKI_S3_BUCKET
      chunks: REPLACE_WITH_LOKI_S3_BUCKET
write:
  replicas: 0
deploymentMode: SingleBinary
read:
  replicas: 0

