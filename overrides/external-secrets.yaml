installCRDs: true
serviceAccount:
  create: true
  name: external-secrets
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
webhook:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
certController:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
serviceMonitor:
  enabled: true
  additionalLabels:
    release: kube-prometheus-stack
extraEnv:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem
extraVolumes:
  - name: custom-ca
    hostPath:
      path: /etc/pki/ca-trusts/extracted/pem
      type: Directory
extraVolumeMounts:
  - name: custom-ca
    mountPath: /custom-ca
    readOnly: true
