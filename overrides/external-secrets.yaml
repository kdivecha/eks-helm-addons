webhook:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
extraVolumeMounts:
- name: custom-ca
  mountPath: /custom-ca
  readOnly: true
extraEnv:
- name: AWS_CA_BUNDLE
  value: /custom-ca/tls-ca-bundle.pem
extraVolumes:
- name: custom-ca
  hostPath:
    type: Directory
    path: /etc/pki/ca-trusts/extracted/pem
serviceAccount:
  create: true
  name: external-secrets
serviceMonitor:
  additionalLabels:
    release: kube-prometheus-stack
  enabled: true
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
certController:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
installCRDs: true

