controller:
  extraVolumeMounts:
  - name: custom-ca
    mountPath: /custom-ca
    readOnly: true
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  extraVolumes:
  - name: custom-ca
    hostPath:
      type: Directory
      path: /etc/pki/ca-trusts/extracted/pem
  env:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem

