approverRole:
  namespace: cert-manager
  serviceAccountName: cert-manager
  enabled: true
volumeMounts:
- name: custom-ca
  mountPath: /custom-ca
  readOnly: true
serviceAccount:
  create: true
  name: aws-privateca-issuer
volumes:
- name: custom-ca
  hostPath:
    type: Directory
    path: /etc/pki/ca-trusts/extracted/pem
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
env:
  AWS_CA_BUNDLE: /custom-ca/tls-ca-bundle.pem

