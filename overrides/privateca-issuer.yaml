env:
  AWS_CA_BUNDLE: /custom-ca/tls-ca-bundle.pem
serviceAccount:
  create: true
  name: aws-privateca-issuer
approverRole:
  serviceAccountName: cert-manager
  namespace: cert-manager
  enabled: true
volumes:
- name: custom-ca
  hostPath:
    path: /etc/pki/ca-trusts/extracted/pem
    type: Directory
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
volumeMounts:
- name: custom-ca
  readOnly: true
  mountPath: /custom-ca
