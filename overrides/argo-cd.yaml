global:
  logging:
    level: info
server:
  volumes:
  - name: custom-ca-bundle
    hostPath:
      type: Directory
      path: /etc/pki/tls/certs
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 125m
      memory: 256Mi
  volumeMounts:
  - name: custom-ca-bundle
    mountPath: /host-ca
    readOnly: true
  env:
  - name: AWS_CA_BUNDLE
    value: /host-ca/tls-ca-bundle.pem
repoServer:
  volumes:
  - name: custom-ca-bundle
    hostPath:
      type: Directory
      path: /etc/pki/tls/certs
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
  volumeMounts:
  - name: custom-ca-bundle
    mountPath: /host-ca
    readOnly: true
  env:
  - name: AWS_CA_BUNDLE
    value: /host-ca/tls-ca-bundle.pem

