global:
  logging:
    level: info
server:
  volumeMounts:
  - name: custom-ca
    mountPath: /custom-ca
    readOnly: true
  service:
    annotations:
      alb.ingress.kubernetes.io/backend-protocol-version: HTTP2
      alb.ingress.kubernetes.io/healthcheck-path: /healthz
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
      alb.ingress.kubernetes.io/success-codes: "200"
      alb.ingress.kubernetes.io/backend-protocol: HTTPS
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 125m
      memory: 256Mi
  env:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem
  volumes:
  - name: custom-ca
    hostPath:
      type: Directory
      path: /etc/pki/ca-trusts/extracted/pem
repoServer:
  volumes:
  - name: custom-ca
    hostPath:
      type: Directory
      path: /etc/pki/ca-trusts/extracted/pem
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
  volumeMounts:
  - name: custom-ca
    mountPath: /custom-ca
    readOnly: true
  env:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem

