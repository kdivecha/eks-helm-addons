env:
  AWS_CA_BUNDLE: /custom-ca/tls-ca-bundle.pem
extraVolumeMounts:
- name: custom-ca
  readOnly: true
  mountPath: /custom-ca
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
extraVolumes:
- name: custom-ca
  hostPath:
    path: /etc/pki/ca-trusts/extracted/pem
    type: Directory
