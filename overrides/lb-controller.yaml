extraVolumeMounts:
- name: custom-ca
  mountPath: /custom-ca
  readOnly: true
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi
extraVolumes:
- name: custom-ca
  hostPath:
    type: Directory
    path: /etc/pki/ca-trusts/extracted/pem
env:
  AWS_CA_BUNDLE: /custom-ca/tls-ca-bundle.pem

