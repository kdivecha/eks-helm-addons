extraVolumeMounts:
- name: custom-ca
  mountPath: /custom-ca
  readOnly: true
extraVolumes:
- name: custom-ca
  hostPath:
    type: Directory
    path: /etc/pki/ca-trusts/extracted/pem
config:
  linear:
    min: 1
    coresPerReplica: 256
    nodesPerReplica: 16
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
env:
- name: AWS_CA_BUNDLE
  value: /custom-ca/tls-ca-bundle.pem
options:
  target: deployment/coredns

