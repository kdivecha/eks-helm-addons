env:
- name: AWS_CA_BUNDLE
  value: /custom-ca/tls-ca-bundle.pem
serviceAccount:
  create: true
  name: cert-manager
volumeMounts:
- name: custom-ca
  readOnly: true
  mountPath: /custom-ca
extraArgs:
- --issuer-ambient-credentials
installCRDs: true
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
volumes:
- name: custom-ca
  hostPath:
    path: /etc/pki/ca-trusts/extracted/pem
    type: Directory
cainjector:
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
webhook:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
