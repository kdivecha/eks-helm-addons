webhook:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
cainjector:
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
volumes:
- name: custom-ca
  hostPath:
    type: Directory
    path: /etc/pki/ca-trusts/extracted/pem
serviceAccount:
  create: true
  name: cert-manager
volumeMounts:
- name: custom-ca
  mountPath: /custom-ca
  readOnly: true
extraArgs:
- --issuer-ambient-credentials
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
extraEnv:
- name: AWS_CA_BUNDLE
  value: /custom-ca/tls-ca-bundle.pem
installCRDs: true
