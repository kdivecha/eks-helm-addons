defaultStorageClass:
  enabled: false
storageClasses:
- name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Delete
  parameters:
    type: gp3
    encrypted: "true"
node:
  volumes:
  - name: custom-ca-bundle
    hostPath:
      type: Directory
      path: /etc/pki/tls/certs
  volumeMounts:
  - name: custom-ca-bundle
    mountPath: /host-ca
    readOnly: true
  env:
  - name: AWS_CA_BUNDLE
    value: /host-ca/tls-ca-bundle.pem
controller:
  volumes:
  - name: custom-ca-bundle
    hostPath:
      type: Directory
      path: /etc/pki/tls/certs
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  volumeMounts:
  - name: custom-ca-bundle
    mountPath: /host-ca
    readOnly: true
  env:
  - name: AWS_CA_BUNDLE
    value: /host-ca/tls-ca-bundle.pem
