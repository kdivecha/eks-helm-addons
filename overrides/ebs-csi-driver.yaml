node:
  extraVolumeMounts:
  - name: custom-ca-bundle
    mountPath: /host-ca
    readOnly: true
  extraVolumes:
  - name: custom-ca-bundle
    hostPath:
      type: Directory
      path: /etc/pki/tls/certs
  env:
  - name: AWS_CA_BUNDLE
    value: /host-ca/tls-ca-bundle.pem
controller:
  extraVolumeMounts:
  - name: custom-ca-bundle
    mountPath: /host-ca
    readOnly: true
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  extraVolumes:
  - name: custom-ca-bundle
    hostPath:
      type: Directory
      path: /etc/pki/tls/certs
  env:
  - name: AWS_CA_BUNDLE
    value: /host-ca/tls-ca-bundle.pem

