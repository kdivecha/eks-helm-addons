defaultStorageClass:
  enabled: false
storageClasses:
- volumeBindingMode: WaitForFirstConsumer
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  name: gp3
  reclaimPolicy: Delete
  parameters:
    type: gp3
    encrypted: "true"
  allowVolumeExpansion: true
controller:
  env:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem
  volumeMounts:
  - name: custom-ca
    readOnly: true
    mountPath: /custom-ca
  volumes:
  - name: custom-ca
    hostPath:
      path: /etc/pki/ca-trusts/extracted/pem
      type: Directory
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
node:
  env:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem
  volumeMounts:
  - name: custom-ca
    readOnly: true
    mountPath: /custom-ca
  volumes:
  - name: custom-ca
    hostPath:
      path: /etc/pki/ca-trusts/extracted/pem
      type: Directory
