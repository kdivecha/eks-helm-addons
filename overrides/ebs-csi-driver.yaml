node:
  volumes:
  - name: custom-ca
    hostPath:
      type: Directory
      path: /etc/pki/ca-trusts/extracted/pem
  volumeMounts:
  - name: custom-ca
    mountPath: /custom-ca
    readOnly: true
  env:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem
storageClasses:
- allowVolumeExpansion: true
  reclaimPolicy: Delete
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  parameters:
    type: gp3
    encrypted: "true"
  name: gp3
  volumeBindingMode: WaitForFirstConsumer
defaultStorageClass:
  enabled: false
controller:
  volumes:
  - name: custom-ca
    hostPath:
      type: Directory
      path: /etc/pki/ca-trusts/extracted/pem
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  volumeMounts:
  - name: custom-ca
    mountPath: /custom-ca
    readOnly: true
  env:
  - name: AWS_CA_BUNDLE
    value: /custom-ca/tls-ca-bundle.pem

