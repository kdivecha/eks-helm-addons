config:
  jetstream:
    fileStore:
      pvc:
        storageClassName: gp3
        size: 10Gi
        enabled: true
      enabled: true
    enabled: true
  monitor:
    enabled: true
container:
  env:
    AWS_CA_BUNDLE: /custom-ca/tls-ca-bundle.pem
  volumeMounts:
  - name: custom-ca
    readOnly: true
    mountPath: /custom-ca
volumes:
- name: custom-ca
  hostPath:
    path: /etc/pki/ca-trusts/extracted/pem
    type: Directory
promExporter:
  podMonitor:
    enabled: true
  enabled: true
nats:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
