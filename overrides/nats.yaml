config:
  merge:
    authorization:
      users:
      - user: << $NATS_AUTH_USERNAME >>
        password: << $NATS_AUTH_PASSWORD >>
  jetstream:
    fileStore:
      pvc:
        storageClassName: gp3
        size: 10Gi
        enabled: true
      enabled: true
    enabled: true
  monitor:
    enabled: true
container:
  env:
    AWS_CA_BUNDLE: /custom-ca/tls-ca-bundle.pem
    NATS_AUTH_USERNAME:
      valueFrom:
        secretKeyRef:
          name: nats-auth
          key: username
    NATS_AUTH_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nats-auth
          key: password
  patch:
  - op: add
    path: /volumeMounts/-
    value:
      name: custom-ca
      mountPath: /custom-ca
      readOnly: true
podTemplate:
  patch:
  - op: add
    path: /spec/volumes/-
    value:
      name: custom-ca
      hostPath:
        path: /etc/pki/ca-trusts/extracted/pem
        type: Directory
promExporter:
  podMonitor:
    enabled: true
  enabled: true
nats:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
