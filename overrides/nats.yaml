volumes:
- name: custom-ca-bundle
  hostPath:
    type: Directory
    path: /etc/pki/tls/certs
container:
  volumeMounts:
  - name: custom-ca-bundle
    mountPath: /host-ca
    readOnly: true
  env:
    AWS_CA_BUNDLE: /host-ca/tls-ca-bundle.pem
config:
  monitor:
    enabled: true
  jetstream:
    enabled: true
    fileStore:
      enabled: true
      pvc:
        enabled: true
        storageClassName: gp3
        size: 10Gi
promExporter:
  enabled: true
  podMonitor:
    enabled: true
nats:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
