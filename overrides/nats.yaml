podTemplate:
  patch:
  - path: /spec/volumes/-
    value:
      name: custom-ca
      hostPath:
        type: Directory
        path: /etc/pki/ca-trusts/extracted/pem
    op: add
nats:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
promExporter:
  podMonitor:
    enabled: true
  enabled: true
container:
  patch:
  - path: /volumeMounts/-
    value:
      name: custom-ca
      mountPath: /custom-ca
      readOnly: true
    op: add
  env:
    AWS_CA_BUNDLE: /custom-ca/tls-ca-bundle.pem
config:
  monitor:
    enabled: true
  jetstream:
    fileStore:
      pvc:
        storageClassName: gp3
        size: 10Gi
        enabled: true
      enabled: true
    enabled: true

