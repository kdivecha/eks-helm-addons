serviceAccount:
  create: true
  name: external-dns
provider:
  name: aws
sources:
- service
- ingress
policy: upsert-only
registry: txt
txtOwnerId: REPLACE_WITH_EXTERNAL_DNS_TXT_OWNER_ID
domainFilters:
- REPLACE_WITH_ROUTE53_DOMAIN
extraArgs:
- --aws-zone-type=private
- --zone-id-filter=REPLACE_WITH_ROUTE53_HOSTED_ZONE_ID
extraVolumeMounts:
- name: custom-ca-bundle
  mountPath: /host-ca
  readOnly: true
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
extraVolumes:
- name: custom-ca-bundle
  hostPath:
    type: Directory
    path: /etc/pki/tls/certs
env:
- name: AWS_CA_BUNDLE
  value: /host-ca/tls-ca-bundle.pem
