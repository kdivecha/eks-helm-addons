resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi
domainFilters:
- REPLACE_WITH_ROUTE53_DOMAIN
extraVolumes:
- name: custom-ca
  hostPath:
    type: Directory
    path: /etc/pki/ca-trusts/extracted/pem
txtOwnerId: REPLACE_WITH_EXTERNAL_DNS_TXT_OWNER_ID
policy: upsert-only
registry: txt
serviceAccount:
  create: true
  name: external-dns
provider:
  name: aws
sources:
- service
- ingress
extraArgs:
- --aws-zone-type=private
- --zone-id-filter=REPLACE_WITH_ROUTE53_HOSTED_ZONE_ID
extraVolumeMounts:
- name: custom-ca
  mountPath: /custom-ca
  readOnly: true
env:
- name: AWS_CA_BUNDLE
  value: /custom-ca/tls-ca-bundle.pem

