apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-client-credentials
  namespace: app-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: nats-client-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NATS_URL: nats://nats.nats-system.svc.cluster.local:4222
  data:
    - secretKey: NATS_USERNAME
      remoteRef:
        key: ext-eks-nats-auth
        property: username
    - secretKey: NATS_PASSWORD
      remoteRef:
        key: ext-eks-nats-auth
        property: password
