# Pod Identity role definitions. ProgramManaged- is the required role and inline-policy
# name prefix; every name ends with -pod-identity.
Roles:
  - RoleName: ProgramManaged-lb-controller-pod-identity
    TrustPolicyFile: policies/lb-controller-trust.json
    PermissionPolicyFile: policies/lb-controller-perm.json
  - RoleName: ProgramManaged-ebs-csi-driver-pod-identity
    TrustPolicyFile: policies/ebs-csi-driver-trust.json
    PermissionPolicyFile: policies/ebs-csi-driver-perm.json
  - RoleName: ProgramManaged-external-dns-pod-identity
    TrustPolicyFile: policies/external-dns-trust.json
    PermissionPolicyFile: policies/external-dns-perm.json
  - RoleName: ProgramManaged-external-secrets-pod-identity
    TrustPolicyFile: policies/external-secrets-trust.json
    PermissionPolicyFile: policies/external-secrets-perm.json
  - RoleName: ProgramManaged-privateca-issuer-pod-identity
    TrustPolicyFile: policies/privateca-issuer-trust.json
    PermissionPolicyFile: policies/privateca-issuer-perm.json
  - RoleName: ProgramManaged-loki-pod-identity
    TrustPolicyFile: policies/loki-trust.json
    PermissionPolicyFile: policies/loki-perm.json
  - RoleName: ProgramManaged-karpenter-pod-identity
    TrustPolicyFile: policies/karpenter-trust.json
    PermissionPolicyFile: policies/karpenter-perm.json
