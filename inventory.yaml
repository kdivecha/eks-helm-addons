      env:
        - name: AWS_CA_BUNDLE
          value: "/custom-ca/tls-ca-bundle.pem"
      extraVolumes:
        - name: custom-ca
          hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
      extraVolumeMounts:
        - name: custom-ca
          mountPath: "/custom-ca"
          readOnly: true
