- ChartName: eks-pod-identity-agent
  Enabled: true
  RepoUrl: https://github.com/aws/eks-pod-identity-agent
  ChartVersion: v0.2.1
  Namespace: kube-system
  ValuesFile: pod-identity.yaml
  IsGitRepoChart: true
  RolloutTargets:
    - Type: daemonset
      Name: eks-pod-identity-agent

- ChartName: external-secrets
  Enabled: true
  RepoUrl: https://charts.external-secrets.io
  ChartVersion: 2.10.0
  Namespace: external-secrets
  ValuesFile: external-secrets.yaml
  PodIdentity:
    RoleArn: arn:aws-us-gov:iam::123456789012:role/ProgramManaged-external-secrets-pod-identity
    ServiceAccount: external-secrets
  RolloutTargets:
    - Type: deployment
      Name: external-secrets
    - Type: deployment
      Name: external-secrets-webhook
    - Type: deployment
      Name: external-secrets-cert-controller

- ChartName: aws-load-balancer-controller
  Enabled: true
  RepoUrl: https://aws.github.io/eks-charts
  ChartVersion: 1.7.1
  Namespace: kube-system
  ValuesFile: lb-controller.yaml
  PodIdentity:
    RoleArn: arn:aws-us-gov:iam::123456789012:role/ProgramManaged-lb-controller-pod-identity
    ServiceAccount: aws-load-balancer-controller
  RolloutTargets:
    - Type: deployment
      Name: aws-load-balancer-controller

- ChartName: aws-ebs-csi-driver
  Enabled: true
  RepoUrl: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
  ChartVersion: 2.64.0
  Namespace: kube-system
  ValuesFile: ebs-csi-driver.yaml
  PodIdentity:
    RoleArn: arn:aws-us-gov:iam::123456789012:role/ProgramManaged-ebs-csi-driver-pod-identity
    ServiceAccount: ebs-csi-controller-sa
  RolloutTargets:
    - Type: deployment
      Name: ebs-csi-controller
    - Type: daemonset
      Name: ebs-csi-node

- ChartName: cluster-proportional-autoscaler
  Enabled: true
  RepoUrl: https://kubernetes-sigs.github.io/cluster-proportional-autoscaler
  ChartVersion: 1.1.0
  Namespace: kube-system
  ValuesFile: cpa.yaml
  RolloutTargets:
    - Type: deployment
      Name: cluster-proportional-autoscaler

- ChartName: kube-prometheus-stack
  Enabled: true
  RepoUrl: https://prometheus-community.github.io/helm-charts
  ChartVersion: 88.6.1
  Namespace: monitoring
  ValuesFile: prometheus-stack.yaml
  RolloutTargets:
    - Type: deployment
      Name: kube-prometheus-stack-operator
    - Type: deployment
      Name: kube-prometheus-stack-grafana
    - Type: statefulset
      Name: prometheus-kube-prometheus-stack-prometheus
    - Type: statefulset
      Name: kube-prometheus-stack-alertmanager

- ChartName: loki
  Enabled: true
  RepoUrl: https://grafana.github.io/helm-charts
  ChartVersion: 6.55.0
  Namespace: logging
  ValuesFile: loki.yaml
  PodIdentity:
    RoleArn: arn:aws-us-gov:iam::123456789012:role/ProgramManaged-loki-pod-identity
    ServiceAccount: loki
  RolloutTargets:
    - Type: statefulset
      Name: loki
    - Type: deployment
      Name: loki-gateway

- ChartName: promtail
  Enabled: true
  RepoUrl: https://grafana.github.io/helm-charts
  ChartVersion: 6.17.1
  Namespace: logging
  ValuesFile: promtail.yaml
  RolloutTargets:
    - Type: daemonset
      Name: promtail

- ChartName: nats
  Enabled: true
  RepoUrl: https://nats-io.github.io/k8s/helm/charts
  ChartVersion: 2.12.4
  Namespace: nats-system
  ValuesFile: nats.yaml
  RolloutTargets:
    - Type: statefulset
      Name: nats

### REQUIRES R53 SETUP

- ChartName: external-dns
  Enabled: false
  RepoUrl: https://kubernetes-sigs.github.io/external-dns/
  ChartVersion: 1.20.0
  Namespace: kube-system
  ValuesFile: external-dns.yaml
  PodIdentity:
    RoleArn: arn:aws-us-gov:iam::123456789012:role/ProgramManaged-external-dns-pod-identity
    ServiceAccount: external-dns
  RolloutTargets:
    - Type: deployment
      Name: external-dns

### NOT NEEDED SINCE PCA ADDON IS DISABLED

- ChartName: cert-manager
  Enabled: false
  RepoUrl: https://charts.jetstack.io
  ChartVersion: v1.14.4
  Namespace: cert-manager
  ValuesFile: cert-manager.yaml
  RolloutTargets:
    - Type: deployment
      Name: cert-manager
    - Type: deployment
      Name: cert-manager-cainjector
    - Type: deployment
      Name: cert-manager-webhook

### REQUIRES ACM SUBORDINATE CA SETUP SIGNED BY CORPORATE PKI

- ChartName: aws-privateca-issuer
  Enabled: false
  RepoUrl: https://cert-manager.github.io/aws-privateca-issuer
  ChartVersion: v1.9.1
  Namespace: cert-manager
  ValuesFile: privateca-issuer.yaml
  PodIdentity:
    RoleArn: arn:aws-us-gov:iam::123456789012:role/ProgramManaged-privateca-issuer-pod-identity
    ServiceAccount: aws-privateca-issuer
  RolloutTargets:
    - Type: deployment
      Name: aws-privateca-issuer

- ChartName: argo-cd
  ReleaseName: argocd
  Enabled: false
  RepoUrl: https://argoproj.github.io/argo-helm
  ChartVersion: 10.4.1
  Namespace: argocd
  ValuesFile: argo-cd.yaml
  RolloutTargets:
    - Type: deployment
      Name: argocd-server
    - Type: deployment
      Name: argocd-repo-server

- ChartName: karpenter
  Enabled: false
  RepoUrl: oci://public.ecr.aws/karpenter/karpenter
  ChartVersion: 1.14.0
  Namespace: kube-system
  ValuesFile: karpenter.yaml
  IsOCI: true
  PodIdentity:
    RoleArn: arn:aws-us-gov:iam::123456789012:role/ProgramManaged-karpenter-pod-identity
    ServiceAccount: karpenter
  RolloutTargets:
    - Type: deployment
      Name: karpenter
