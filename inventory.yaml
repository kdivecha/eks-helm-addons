- ChartName: eks-pod-identity-agent
  Enabled: true
  RepoUrl: https://github.com/aws/eks-pod-identity-agent
  ChartVersion: v0.2.1
  Namespace: kube-system
  ValuesFile: pod-identity.yaml
  IsGitRepoChart: true
  RolloutTargets:
    - Type: daemonset
      Name: eks-pod-identity-agent
  DefaultValues:
    resources:
      limits: { cpu: "100m", memory: "128Mi" }
      requests: { cpu: "20m", memory: "40Mi" }

- ChartName: aws-load-balancer-controller
  Enabled: true
  RepoUrl: https://aws.github.io/eks-charts
  ChartVersion: 1.7.1
  Namespace: kube-system
  ValuesFile: lb-controller.yaml
  PodIdentity:
    RoleArn: arn:REPLACE_WITH_AWS_PARTITION:iam::123456789012:role/AWSLoadBalancerControllerPodIdentityRole
    ServiceAccount: aws-load-balancer-controller
  RolloutTargets:
    - Type: deployment
      Name: aws-load-balancer-controller
  DefaultValues:
    resources:
      limits: { cpu: "200m", memory: "256Mi" }
      requests: { cpu: "100m", memory: "128Mi" }
    env:
      AWS_CA_BUNDLE: "/custom-ca/tls-ca-bundle.pem"
    extraVolumes:
      - name: custom-ca
        hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
    extraVolumeMounts:
      - name: custom-ca
        mountPath: "/custom-ca"
        readOnly: true

- ChartName: aws-ebs-csi-driver
  Enabled: true
  RepoUrl: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
  ChartVersion: 2.64.0
  Namespace: kube-system
  ValuesFile: ebs-csi-driver.yaml
  PodIdentity:
    RoleArn: arn:REPLACE_WITH_AWS_PARTITION:iam::123456789012:role/AWSEBSCSIDriverPodIdentityRole
    ServiceAccount: ebs-csi-controller-sa
  RolloutTargets:
    - Type: deployment
      Name: ebs-csi-controller
    - Type: daemonset
      Name: ebs-csi-node
  DefaultValues:
    defaultStorageClass:
      enabled: false
    storageClasses:
      - name: gp3
        annotations:
          storageclass.kubernetes.io/is-default-class: "true"
        volumeBindingMode: WaitForFirstConsumer
        allowVolumeExpansion: true
        reclaimPolicy: Delete
        parameters:
          type: gp3
          encrypted: "true"
    controller:
      resources:
        limits: { cpu: "200m", memory: "256Mi" }
        requests: { cpu: "100m", memory: "128Mi" }
      env:
        - name: AWS_CA_BUNDLE
          value: "/custom-ca/tls-ca-bundle.pem"
      volumes:
        - name: custom-ca
          hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
      volumeMounts:
        - name: custom-ca
          mountPath: "/custom-ca"
          readOnly: true
    node:
      env:
        - name: AWS_CA_BUNDLE
          value: "/custom-ca/tls-ca-bundle.pem"
      volumes:
        - name: custom-ca
          hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
      volumeMounts:
        - name: custom-ca
          mountPath: "/custom-ca"
          readOnly: true

- ChartName: cluster-proportional-autoscaler
  Enabled: true
  RepoUrl: https://kubernetes-sigs.github.io/cluster-proportional-autoscaler
  ChartVersion: 1.1.0
  Namespace: kube-system
  ValuesFile: cpa.yaml
  RolloutTargets:
    - Type: deployment
      Name: cluster-proportional-autoscaler
  DefaultValues:
    resources:
      limits: { cpu: "100m", memory: "128Mi" }
      requests: { cpu: "50m", memory: "64Mi" }
    env:
      - name: AWS_CA_BUNDLE
        value: "/custom-ca/tls-ca-bundle.pem"
    extraVolumes:
      - name: custom-ca
        hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
    extraVolumeMounts:
      - name: custom-ca
        mountPath: "/custom-ca"
        readOnly: true
    config:
      linear:
        coresPerReplica: 256
        nodesPerReplica: 16
        min: 1
    options:
      target: deployment/coredns

- ChartName: cert-manager
  Enabled: true
  RepoUrl: https://charts.jetstack.io
  ChartVersion: v1.14.4
  Namespace: cert-manager
  ValuesFile: cert-manager.yaml
  RolloutTargets:
    - Type: deployment
      Name: cert-manager
    - Type: deployment
      Name: cert-manager-cainjector
    - Type: deployment
      Name: cert-manager-webhook
  DefaultValues:
    installCRDs: true
    serviceAccount:
      create: true
      name: cert-manager
    resources:
      limits: { cpu: "100m", memory: "128Mi" }
      requests: { cpu: "50m", memory: "64Mi" }
    extraArgs:
      - --issuer-ambient-credentials
    env:
      - name: AWS_CA_BUNDLE
        value: "/custom-ca/tls-ca-bundle.pem"
    volumes:
      - name: custom-ca
        hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
    volumeMounts:
      - name: custom-ca
        mountPath: "/custom-ca"
        readOnly: true
    cainjector:
      resources:
        limits: { cpu: "100m", memory: "256Mi" }
    webhook:
      resources:
        limits: { cpu: "100m", memory: "128Mi" }

- ChartName: external-dns
  Enabled: true
  RepoUrl: https://kubernetes-sigs.github.io/external-dns/
  ChartVersion: 1.20.0
  Namespace: kube-system
  ValuesFile: external-dns.yaml
  PodIdentity:
    RoleArn: arn:REPLACE_WITH_AWS_PARTITION:iam::123456789012:role/REPLACE_WITH_EXTERNAL_DNS_POD_IDENTITY_ROLE
    ServiceAccount: external-dns
  RolloutTargets:
    - Type: deployment
      Name: external-dns
  DefaultValues:
    serviceAccount:
      create: true
      name: external-dns
    provider:
      name: aws
    sources: [service, ingress]
    policy: upsert-only
    registry: txt
    txtOwnerId: REPLACE_WITH_EXTERNAL_DNS_TXT_OWNER_ID
    domainFilters: [REPLACE_WITH_ROUTE53_DOMAIN]
    extraArgs:
      - --aws-zone-type=private
      - --zone-id-filter=REPLACE_WITH_ROUTE53_HOSTED_ZONE_ID
    resources:
      limits: { cpu: "100m", memory: "128Mi" }
      requests: { cpu: "50m", memory: "64Mi" }
    env:
      - name: AWS_CA_BUNDLE
        value: "/custom-ca/tls-ca-bundle.pem"
    extraVolumes:
      - name: custom-ca
        hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
    extraVolumeMounts:
      - name: custom-ca
        mountPath: "/custom-ca"
        readOnly: true

- ChartName: aws-privateca-issuer
  Enabled: false
  RepoUrl: https://cert-manager.github.io/aws-privateca-issuer
  ChartVersion: v1.9.1
  Namespace: cert-manager
  ValuesFile: privateca-issuer.yaml
  PodIdentity:
    RoleArn: arn:REPLACE_WITH_AWS_PARTITION:iam::123456789012:role/REPLACE_WITH_AWS_PRIVATECA_ISSUER_POD_IDENTITY_ROLE
    ServiceAccount: aws-privateca-issuer
  RolloutTargets:
    - Type: deployment
      Name: aws-privateca-issuer
  DefaultValues:
    serviceAccount:
      create: true
      name: aws-privateca-issuer
    approverRole:
      enabled: true
      serviceAccountName: cert-manager
      namespace: cert-manager
    resources:
      limits: { cpu: "100m", memory: "128Mi" }
      requests: { cpu: "50m", memory: "64Mi" }
    env:
      AWS_CA_BUNDLE: "/custom-ca/tls-ca-bundle.pem"
    volumes:
      - name: custom-ca
        hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
    volumeMounts:
      - name: custom-ca
        mountPath: "/custom-ca"
        readOnly: true

- ChartName: kube-prometheus-stack
  Enabled: true
  RepoUrl: https://prometheus-community.github.io/helm-charts
  ChartVersion: 88.6.1
  Namespace: monitoring
  ValuesFile: prometheus-stack.yaml
  RolloutTargets:
    - Type: deployment
      Name: kube-prometheus-stack-operator
    - Type: deployment
      Name: kube-prometheus-stack-grafana
    - Type: statefulset
      Name: prometheus-kube-prometheus-stack-prometheus
    - Type: statefulset
      Name: kube-prometheus-stack-alertmanager
  DefaultValues:
    crds:
      enabled: true
    prometheus:
      prometheusSpec:
        resources:
          limits: { cpu: "1000m", memory: "2Gi" }
          requests: { cpu: "500m", memory: "1Gi" }
        containers:
          - name: prometheus
            env:
              - name: AWS_CA_BUNDLE
                value: "/custom-ca/tls-ca-bundle.pem"
            volumeMounts:
              - name: custom-ca
                mountPath: "/custom-ca"
                readOnly: true
        volumes:
          - name: custom-ca
            hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: gp3
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
    grafana:
      adminUser: admin
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki-gateway.monitoring.svc.cluster.local
      service:
        annotations:
          alb.ingress.kubernetes.io/backend-protocol: HTTP
          alb.ingress.kubernetes.io/healthcheck-path: /api/health
          alb.ingress.kubernetes.io/success-codes: "200"
      resources:
        limits: { cpu: "100m", memory: "128Mi" }
        requests: { cpu: "50m", memory: "64Mi" }
      persistence:
        enabled: true
        storageClassName: gp3
        accessModes: ["ReadWriteOnce"]
        size: 10Gi
      env:
        AWS_CA_BUNDLE: "/custom-ca/tls-ca-bundle.pem"
      extraVolumes:
        - name: custom-ca
          hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
      extraVolumeMounts:
        - name: custom-ca
          mountPath: "/custom-ca"
          readOnly: true
    alertmanager:
      enabled: true
      alertmanagerSpec:
        resources:
          limits: { cpu: "100m", memory: "128Mi" }
          requests: { cpu: "50m", memory: "64Mi" }
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: gp3
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi

- ChartName: loki
  Enabled: true
  RepoUrl: https://grafana.github.io/helm-charts
  ChartVersion: 6.55.0
  Namespace: monitoring
  ValuesFile: loki.yaml
  PodIdentity:
    RoleArn: arn:REPLACE_WITH_AWS_PARTITION:iam::123456789012:role/LokiPodIdentityRole
    ServiceAccount: loki
  RolloutTargets:
    - Type: statefulset
      Name: loki
    - Type: deployment
      Name: loki-gateway
  DefaultValues:
    loki:
      storage:
        bucketNames:
          chunks: REPLACE_WITH_LOKI_S3_BUCKET
          ruler: REPLACE_WITH_LOKI_S3_BUCKET
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: s3
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
    deploymentMode: SingleBinary
    serviceAccount:
      name: loki
    singleBinary:
      replicas: 1
      resources:
        limits: { cpu: "500m", memory: "1Gi" }
        requests: { cpu: "250m", memory: "512Mi" }
      extraEnv:
        - name: AWS_CA_BUNDLE
          value: "/custom-ca/tls-ca-bundle.pem"
      extraVolumes:
        - name: custom-ca
          hostPath: { path: "/etc/pki/ca-trusts/extracted/pem" }
      extraVolumeMounts:
        - name: custom-ca
          mountPath: "/custom-ca"
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0

- ChartName: promtail
  Enabled: true
  RepoUrl: https://grafana.github.io/helm-charts
  ChartVersion: 6.17.1
  Namespace: logging
  ValuesFile: promtail.yaml
  RolloutTargets:
    - Type: daemonset
      Name: promtail
  DefaultValues:
    config:
      snippets:
        extraRelabelConfigs:
          - action: replace
            source_labels: [__tmp_controller_name]
            target_label: workload
          - action: replace
            source_labels: [__meta_kubernetes_pod_controller_kind]
            target_label: workload_kind
          - action: replace
            source_labels: [__meta_kubernetes_pod_controller_kind]
            regex: ReplicaSet
            replacement: Deployment
            target_label: workload_kind
    resources:
      limits: { cpu: "200m", memory: "256Mi" }
      requests: { cpu: "100m", memory: "128Mi" }
    extraEnv:
      - name: AWS_CA_BUNDLE
        value: "/custom-ca/tls-ca-bundle.pem"
    extraVolumes:
      - name: custom-ca
        hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
    extraVolumeMounts:
      - name: custom-ca
        mountPath: "/custom-ca"
        readOnly: true

- ChartName: nats
  Enabled: true
  RepoUrl: https://nats-io.github.io/k8s/helm/charts
  ChartVersion: 2.12.4
  Namespace: nats-system
  ValuesFile: nats.yaml
  RolloutTargets:
    - Type: statefulset
      Name: nats
  DefaultValues:
    config:
      monitor:
        enabled: true
      jetstream:
        enabled: true
        fileStore:
          enabled: true
          pvc:
            enabled: true
            storageClassName: gp3
            size: 10Gi
    promExporter:
      enabled: true
      podMonitor:
        enabled: true
    nats:
      resources:
        limits: { cpu: "500m", memory: "512Mi" }
        requests: { cpu: "250m", memory: "256Mi" }
    container:
      env:
        AWS_CA_BUNDLE: "/custom-ca/tls-ca-bundle.pem"
      volumeMounts:
        - name: custom-ca
          mountPath: "/custom-ca"
          readOnly: true
    volumes:
      - name: custom-ca
        hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }

- ChartName: argo-cd
  ReleaseName: argocd
  Enabled: false
  RepoUrl: https://argoproj.github.io/argo-helm
  ChartVersion: 10.4.1
  Namespace: argocd
  ValuesFile: argo-cd.yaml
  RolloutTargets:
    - Type: deployment
      Name: argocd-server
    - Type: deployment
      Name: argocd-repo-server
  DefaultValues:
    global:
      logging: { level: info }
    server:
      service:
        annotations:
          alb.ingress.kubernetes.io/backend-protocol: HTTPS
          alb.ingress.kubernetes.io/backend-protocol-version: HTTP2
          alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
          alb.ingress.kubernetes.io/healthcheck-path: /healthz
          alb.ingress.kubernetes.io/success-codes: "200"
      resources:
        limits: { cpu: "500m", memory: "512Mi" }
        requests: { cpu: "125m", memory: "256Mi" }
      env:
        - name: AWS_CA_BUNDLE
          value: "/custom-ca/tls-ca-bundle.pem"
      volumes:
        - name: custom-ca
          hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
      volumeMounts:
        - name: custom-ca
          mountPath: "/custom-ca"
          readOnly: true
    repoServer:
      resources:
        limits: { cpu: "1000m", memory: "1Gi" }
      env:
        - name: AWS_CA_BUNDLE
          value: "/custom-ca/tls-ca-bundle.pem"
      volumes:
        - name: custom-ca
          hostPath: { path: "/etc/pki/ca-trusts/extracted/pem", type: Directory }
      volumeMounts:
        - name: custom-ca
          mountPath: "/custom-ca"
          readOnly: true

- ChartName: karpenter
  Enabled: false
  RepoUrl: oci://public.ecr.aws/karpenter/karpenter
  ChartVersion: 1.14.0
  Namespace: kube-system
  ValuesFile: karpenter.yaml
  IsOCI: true
  PodIdentity:
    RoleArn: arn:REPLACE_WITH_AWS_PARTITION:iam::123456789012:role/KarpenterPodIdentityRole
    ServiceAccount: karpenter
  RolloutTargets:
    - Type: deployment
      Name: karpenter
  DefaultValues:
    controller:
      resources:
        limits: { cpu: "1000m", memory: "1Gi" }
